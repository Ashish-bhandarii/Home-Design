<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 85" width="70" height="85">
  <!-- Medicine Cabinet - Front View -->
  <rect x="2" y="2" width="66" height="81" rx="2" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.2"/>
  <!-- Door -->
  <rect x="5" y="5" width="60" height="75" rx="1" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="0.8"/>
  <!-- Mirror surface -->
  <rect x="8" y="8" width="54" height="69" fill="#BAE6FD" stroke="#94a3b8" stroke-width="0.5"/>
  <!-- Reflection -->
  <path d="M 12 12 L 28 12 L 12 32 Z" fill="#fff" opacity="0.25"/>
  <!-- Handle -->
  <circle cx="58" cy="42" r="3" fill="#a1a1aa" stroke="#71717a" stroke-width="0.5"/>
  <!-- Shelf lines visible through mirror (subtle) -->
  <line x1="10" y1="30" x2="60" y2="30" stroke="#94a3b8" stroke-width="0.3" opacity="0.4"/>
  <line x1="10" y1="52" x2="60" y2="52" stroke="#94a3b8" stroke-width="0.3" opacity="0.4"/>
</svg>