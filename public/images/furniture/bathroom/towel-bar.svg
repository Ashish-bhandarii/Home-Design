<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 25" width="80" height="25">
  <!-- Double Towel Bar - Front View -->
  <!-- Mounting brackets -->
  <circle cx="8" cy="8" r="5" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="0.8"/>
  <circle cx="72" cy="8" r="5" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="0.8"/>
  <!-- Top bar -->
  <rect x="8" y="5" width="64" height="3" rx="1.5" fill="#c0c0c0" stroke="#a1a1aa" stroke-width="0.5"/>
  <line x1="12" y1="6" x2="68" y2="6" stroke="#e5e5e5" stroke-width="0.6" opacity="0.5"/>
  <!-- Bottom bar -->
  <rect x="8" y="14" width="64" height="3" rx="1.5" fill="#c0c0c0" stroke="#a1a1aa" stroke-width="0.5"/>
  <line x1="12" y1="15" x2="68" y2="15" stroke="#e5e5e5" stroke-width="0.6" opacity="0.5"/>
  <!-- Bracket arms -->
  <rect x="6" y="8" width="3" height="8" rx="1" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="0.3"/>
  <rect x="71" y="8" width="3" height="8" rx="1" fill="#d4d4d8" stroke="#a1a1aa" stroke-width="0.3"/>
</svg>