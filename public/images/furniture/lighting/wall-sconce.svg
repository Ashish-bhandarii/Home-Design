  <path d="M 14 20 Q 14 12 20 9 Q 22 12 22 20 Z" fill="#ffffff" opacity="0.3"/>
  <!-- Bulb glow -->
  <circle cx="20" cy="18" r="3" fill="#FDE68A" opacity="0.7"/>
  <!-- Screw detail -->
  <circle cx="20" cy="42" r="1.5" fill="#A1A1AA"/>
