<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 55" width="40" height="55">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#FDE68A;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:0"/>
