  </defs>
  <!-- Light glow background -->
  <ellipse cx="20" cy="22" rx="18" ry="22" fill="url(#glow)" opacity="0.5"/>
  <!-- Wall plate -->
  <rect x="14" y="30" width="12" height="18" rx="2" fill="#D4D4D8" stroke="#A1A1AA" stroke-width="1"/>
  <!-- Arm -->
  <rect x="16" y="24" width="8" height="8" rx="1" fill="#D4D4D8" stroke="#A1A1AA" stroke-width="0.5"/>
  <!-- Glass shade -->
  <path d="M 10 24 Q 10 8 20 5 Q 30 8 30 24 Z" fill="#f1f5f9" stroke="#9CA3AF" stroke-width="1" opacity="0.85"/>
