<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 110" width="170" height="110">
  <defs>
    <linearGradient id="ev-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="60%" stop-color="#4682B4"/>
      <stop offset="100%" stop-color="#87CEEB"/>
    </linearGradient>
    <linearGradient id="ev-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E2610"/>
      <stop offset="50%" stop-color="#2E1A0D"/>
      <stop offset="100%" stop-color="#1E1008"/>
    </linearGradient>
    <linearGradient id="ev-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F0F8FF"/>
      <stop offset="100%" stop-color="#B0C4DE"/>
    </linearGradient>
    <linearGradient id="ev-rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#556B2F"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="4" y="4" width="166" height="106" rx="2" fill="rgba(0,0,0,0.35)"/>
  <!-- Outer frame - dark wood -->
  <rect x="0" y="0" width="166" height="106" rx="2" fill="url(#ev-wood)" stroke="#1A0E06" stroke-width="1.5"/>
  <!-- Inner frame -->
  <rect x="6" y="6" width="154" height="94" rx="1" fill="#2E1A0D" stroke="#5D3A1A" stroke-width="1"/>
  <!-- Canvas -->
  <rect x="10" y="10" width="146" height="86" fill="url(#ev-sky)"/>
  <!-- Cloud wisps -->
  <ellipse cx="40" cy="40" rx="15" ry="4" fill="white" opacity="0.2"/>
  <ellipse cx="120" cy="35" rx="18" ry="3" fill="white" opacity="0.15"/>
  <!-- Background mountain range -->
  <polygon points="10,70 25,50 45,60 60,45 75,55 90,42 105,52 120,40 140,55 156,48 156,96 10,96" fill="url(#ev-rock)" opacity="0.6"/>
  <!-- Mount Everest - main peak -->
  <polygon points="55,70 83,15 110,70" fill="url(#ev-snow)"/>
  <!-- Snow detail lines -->
  <polygon points="75,30 83,15 91,30 86,35 80,32" fill="#FFFFFF"/>
  <line x1="83" y1="15" x2="78" y2="40" stroke="#D0D8E0" stroke-width="0.5" opacity="0.6"/>
  <line x1="83" y1="15" x2="90" y2="45" stroke="#D0D8E0" stroke-width="0.5" opacity="0.6"/>
  <!-- Rock ridges on Everest -->
  <polygon points="70,55 83,25 96,55 88,50 78,52" fill="#A9B4C0" opacity="0.4"/>
  <!-- Side peak left -->
  <polygon points="20,70 40,35 60,70" fill="#C0CAD4" opacity="0.7"/>
  <polygon points="35,45 40,35 45,45" fill="#FFFFFF" opacity="0.8"/>
  <!-- Side peak right -->
  <polygon points="100,70 125,38 150,70" fill="#B8C4D0" opacity="0.7"/>
  <polygon points="120,48 125,38 130,48" fill="#FFFFFF" opacity="0.8"/>
  <!-- Wind/snow plume from peak -->
  <path d="M83,15 Q95,12 110,18 Q105,14 95,13" fill="white" opacity="0.4"/>
  <!-- Foreground dark ridge -->
  <polygon points="10,80 30,68 50,75 70,65 90,72 110,66 130,73 156,68 156,96 10,96" fill="#2F4F4F" opacity="0.7"/>
  <!-- Foreground base -->
  <rect x="10" y="85" width="146" height="11" fill="#3B5323" opacity="0.5"/>
</svg>