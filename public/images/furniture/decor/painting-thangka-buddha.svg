      <stop offset="0%" style="stop-color:#8B0000"/><stop offset="50%" style="stop-color:#A00000"/><stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="114" height="144" rx="1" fill="#00000020"/>
  <!-- Brocade border -->
  <rect x="1" y="1" width="118" height="148" fill="url(#brocade)" stroke="#5C0000" stroke-width="1"/>
  <rect x="5" y="5" width="110" height="140" fill="none" stroke="#FFD700" stroke-width="1.5"/>
