<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <pattern id="rugPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#8B7D72"/>
      <rect x="2" y="2" width="16" height="16" fill="#9CA3AF"/>
      <rect x="5" y="5" width="10" height="10" fill="#8B7D72"/>
      <rect x="7" y="7" width="6" height="6" fill="#A8A099"/>
    </pattern>
    <pattern id="borderPattern" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#6B5B50"/>
      <path d="M 0 7.5 L 7.5 0 L 15 7.5 L 7.5 15 Z" fill="#7A6B60" stroke="#5C4D42" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Rug with fringe top -->
  <g>
    <!-- Fringe top -->
    <g stroke="#B8A898" stroke-width="1.5" opacity="0.7">
      <line x1="15" y1="0" x2="15" y2="10"/><line x1="22" y1="0" x2="22" y2="10"/>
      <line x1="29" y1="0" x2="29" y2="10"/><line x1="36" y1="0" x2="36" y2="10"/>
      <line x1="43" y1="0" x2="43" y2="10"/><line x1="50" y1="0" x2="50" y2="10"/>
      <line x1="57" y1="0" x2="57" y2="10"/><line x1="64" y1="0" x2="64" y2="10"/>
      <line x1="71" y1="0" x2="71" y2="10"/><line x1="78" y1="0" x2="78" y2="10"/>
      <line x1="85" y1="0" x2="85" y2="10"/><line x1="92" y1="0" x2="92" y2="10"/>
      <line x1="99" y1="0" x2="99" y2="10"/><line x1="106" y1="0" x2="106" y2="10"/>
      <line x1="113" y1="0" x2="113" y2="10"/><line x1="120" y1="0" x2="120" y2="10"/>
      <line x1="127" y1="0" x2="127" y2="10"/><line x1="134" y1="0" x2="134" y2="10"/>
      <line x1="141" y1="0" x2="141" y2="10"/><line x1="148" y1="0" x2="148" y2="10"/>
      <line x1="155" y1="0" x2="155" y2="10"/><line x1="162" y1="0" x2="162" y2="10"/>
      <line x1="169" y1="0" x2="169" y2="10"/><line x1="176" y1="0" x2="176" y2="10"/>
      <line x1="183" y1="0" x2="183" y2="10"/>
    </g>
    <!-- Fringe bottom -->
    <g stroke="#B8A898" stroke-width="1.5" opacity="0.7">
      <line x1="15" y1="290" x2="15" y2="300"/><line x1="22" y1="290" x2="22" y2="300"/>
      <line x1="29" y1="290" x2="29" y2="300"/><line x1="36" y1="290" x2="36" y2="300"/>
      <line x1="43" y1="290" x2="43" y2="300"/><line x1="50" y1="290" x2="50" y2="300"/>
      <line x1="57" y1="290" x2="57" y2="300"/><line x1="64" y1="290" x2="64" y2="300"/>
      <line x1="71" y1="290" x2="71" y2="300"/><line x1="78" y1="290" x2="78" y2="300"/>
      <line x1="85" y1="290" x2="85" y2="300"/><line x1="92" y1="290" x2="92" y2="300"/>
      <line x1="99" y1="290" x2="99" y2="300"/><line x1="106" y1="290" x2="106" y2="300"/>
      <line x1="113" y1="290" x2="113" y2="300"/><line x1="120" y1="290" x2="120" y2="300"/>
      <line x1="127" y1="290" x2="127" y2="300"/><line x1="134" y1="290" x2="134" y2="300"/>
      <line x1="141" y1="290" x2="141" y2="300"/><line x1="148" y1="290" x2="148" y2="300"/>
      <line x1="155" y1="290" x2="155" y2="300"/><line x1="162" y1="290" x2="162" y2="300"/>
      <line x1="169" y1="290" x2="169" y2="300"/><line x1="176" y1="290" x2="176" y2="300"/>
      <line x1="183" y1="290" x2="183" y2="300"/>
    </g>
    <!-- Main rug body -->
    <rect x="5" y="8" width="190" height="284" rx="2" fill="url(#rugPattern)" stroke="#5C4D42" stroke-width="2"/>
    <!-- Border -->
    <rect x="10" y="13" width="180" height="274" fill="none" stroke="#5C4D42" stroke-width="3"/>
    <rect x="16" y="19" width="168" height="262" fill="none" stroke="#7A6B60" stroke-width="1.5"/>
    <!-- Center medallion -->
    <ellipse cx="100" cy="150" rx="45" ry="55" fill="none" stroke="#5C4D42" stroke-width="2"/>
    <ellipse cx="100" cy="150" rx="30" ry="38" fill="#7A6B60" opacity="0.3" stroke="#6B5B50" stroke-width="1"/>
    <ellipse cx="100" cy="150" rx="15" ry="20" fill="#8B7D72" opacity="0.4"/>
  </g>
</svg>