<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="nv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </linearGradient>
    <linearGradient id="nv-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="50%" stop-color="#5D3A1A"/>
      <stop offset="100%" stop-color="#4A2E14"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="4" y="4" width="156" height="106" rx="2" fill="rgba(0,0,0,0.3)"/>
  <!-- Outer frame -->
  <rect x="0" y="0" width="156" height="106" rx="2" fill="url(#nv-wood)" stroke="#3E2610" stroke-width="1.5"/>
  <!-- Inner frame -->
  <rect x="6" y="6" width="144" height="94" rx="1" fill="#4A2E14" stroke="#7B5B3A" stroke-width="1"/>
  <!-- Canvas -->
  <rect x="10" y="10" width="136" height="86" fill="url(#nv-sky)"/>
  <!-- Mountains background -->
  <polygon points="10,60 40,30 70,50 100,25 136,45 146,55 146,96 10,96" fill="#8B7355" opacity="0.4"/>
  <!-- Ground -->
  <rect x="10" y="65" width="136" height="31" fill="#8B6914" opacity="0.6"/>
  <!-- Path/road -->
  <polygon points="70,96 80,65 90,96" fill="#A0825A" opacity="0.5"/>
  <!-- House 1 - traditional with pagoda roof -->
  <rect x="25" y="50" width="22" height="20" fill="#CD853F"/>
  <polygon points="22,50 36,35 50,50" fill="#8B4513"/>
  <polygon points="20,50 36,32 52,50" fill="none" stroke="#6B3410" stroke-width="0.8"/>
  <rect x="32" y="58" width="6" height="12" fill="#5D3A1A"/>
  <rect x="26" y="55" width="5" height="5" fill="#DEB887" stroke="#5D3A1A" stroke-width="0.5"/>
  <!-- House 2 -->
  <rect x="60" y="48" width="20" height="22" fill="#D2B48C"/>
  <polygon points="57,48 70,34 83,48" fill="#A0522D"/>
  <polygon points="55,48 70,31 85,48" fill="none" stroke="#6B3410" stroke-width="0.8"/>
  <rect x="67" y="56" width="5" height="14" fill="#5D3A1A"/>
  <rect x="61" y="52" width="4" height="4" fill="#DEB887" stroke="#5D3A1A" stroke-width="0.5"/>
  <!-- House 3 - pagoda temple -->
  <rect x="100" y="45" width="18" height="25" fill="#C4A575"/>
  <polygon points="97,45 109,30 121,45" fill="#8B4513"/>
  <polygon points="99,37 109,26 119,37" fill="#A0522D"/>
  <line x1="109" y1="26" x2="109" y2="22" stroke="#B8860B" stroke-width="1"/>
  <rect x="106" y="58" width="5" height="12" fill="#5D3A1A"/>
  <!-- Trees -->
  <circle cx="20" cy="55" r="6" fill="#6B8E23" opacity="0.7"/>
  <line x1="20" y1="61" x2="20" y2="68" stroke="#5D3A1A" stroke-width="1.5"/>
  <circle cx="130" cy="50" r="7" fill="#556B2F" opacity="0.7"/>
  <line x1="130" y1="57" x2="130" y2="65" stroke="#5D3A1A" stroke-width="1.5"/>
  <!-- Foreground details -->
  <ellipse cx="50" cy="80" rx="8" ry="3" fill="#6B8E23" opacity="0.4"/>
  <ellipse cx="115" cy="82" rx="6" ry="2" fill="#6B8E23" opacity="0.4"/>
</svg>