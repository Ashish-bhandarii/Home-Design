<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" width="150" height="100">
  <defs>
    <linearGradient id="vl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#F0E68C"/>
    </linearGradient>
    <linearGradient id="vl-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="50%" stop-color="#5D3A1A"/>
      <stop offset="100%" stop-color="#4A2E14"/>
    </linearGradient>
    <linearGradient id="vl-paddy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ACD32"/>
      <stop offset="100%" stop-color="#6B8E23"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="4" y="4" width="146" height="96" rx="2" fill="rgba(0,0,0,0.3)"/>
  <!-- Outer frame -->
  <rect x="0" y="0" width="146" height="96" rx="2" fill="url(#vl-wood)" stroke="#3E2610" stroke-width="1.5"/>
  <!-- Inner frame -->
  <rect x="6" y="6" width="134" height="84" rx="1" fill="#4A2E14" stroke="#7B5B3A" stroke-width="1"/>
  <!-- Canvas -->
  <rect x="10" y="10" width="126" height="76" fill="url(#vl-sky)"/>
  <!-- Distant hills -->
  <polygon points="10,45 30,30 55,40 80,28 110,38 136,32 136,55 10,55" fill="#7CB342" opacity="0.5"/>
  <!-- Rice paddies - layered terraces -->
  <rect x="10" y="52" width="126" height="34" fill="url(#vl-paddy)"/>
  <line x1="10" y1="56" x2="136" y2="56" stroke="#558B2F" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="61" x2="136" y2="61" stroke="#558B2F" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="66" x2="136" y2="66" stroke="#558B2F" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="71" x2="136" y2="71" stroke="#558B2F" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="76" x2="136" y2="76" stroke="#558B2F" stroke-width="0.5" opacity="0.6"/>
  <!-- Water reflection in paddies -->
  <rect x="20" y="57" width="30" height="4" fill="#87CEEB" opacity="0.3" rx="1"/>
  <rect x="70" y="62" width="40" height="4" fill="#87CEEB" opacity="0.3" rx="1"/>
  <rect x="30" y="72" width="35" height="3" fill="#87CEEB" opacity="0.25" rx="1"/>
  <!-- Farmer figure 1 -->
  <circle cx="55" cy="52" r="2.5" fill="#8B6914"/>
  <line x1="55" y1="54.5" x2="55" y2="62" stroke="#8B6914" stroke-width="1.5"/>
  <line x1="55" y1="62" x2="52" y2="67" stroke="#8B6914" stroke-width="1"/>
  <line x1="55" y1="62" x2="58" y2="67" stroke="#8B6914" stroke-width="1"/>
  <line x1="55" y1="56" x2="50" y2="60" stroke="#8B6914" stroke-width="1"/>
  <line x1="55" y1="56" x2="60" y2="58" stroke="#8B6914" stroke-width="1"/>
  <!-- Hat -->
  <ellipse cx="55" cy="50.5" rx="4" ry="1.5" fill="#DAA520"/>
  <!-- Farmer figure 2 -->
  <circle cx="95" cy="55" r="2" fill="#8B6914"/>
  <line x1="95" y1="57" x2="95" y2="63" stroke="#8B6914" stroke-width="1.2"/>
  <line x1="95" y1="63" x2="93" y2="67" stroke="#8B6914" stroke-width="0.8"/>
  <line x1="95" y1="63" x2="97" y2="67" stroke="#8B6914" stroke-width="0.8"/>
  <ellipse cx="95" cy="53.5" rx="3" ry="1.2" fill="#DAA520"/>
  <!-- Small hut -->
  <rect x="110" y="44" width="14" height="12" fill="#D2B48C"/>
  <polygon points="108,44 117,36 126,44" fill="#8B4513"/>
  <rect x="115" y="49" width="4" height="7" fill="#5D3A1A"/>
  <!-- Ox/buffalo silhouette -->
  <ellipse cx="35" cy="60" rx="6" ry="3.5" fill="#4A3728"/>
  <circle cx="30" cy="57.5" r="2.5" fill="#4A3728"/>
  <line x1="32" y1="63" x2="32" y2="67" stroke="#4A3728" stroke-width="1"/>
  <line x1="38" y1="63" x2="38" y2="67" stroke="#4A3728" stroke-width="1"/>
  <!-- Sun -->
  <circle cx="125" cy="20" r="8" fill="#FFD700" opacity="0.8"/>
</svg>