<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" width="130" height="100">
  <defs>
    <linearGradient id="pp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA500"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFECD2"/>
    </linearGradient>
    <linearGradient id="pp-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="50%" stop-color="#5D3A1A"/>
      <stop offset="100%" stop-color="#4A2E14"/>
    </linearGradient>
    <linearGradient id="pp-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="4" y="4" width="126" height="96" rx="2" fill="rgba(0,0,0,0.3)"/>
  <!-- Outer frame -->
  <rect x="0" y="0" width="126" height="96" rx="2" fill="url(#pp-wood)" stroke="#3E2610" stroke-width="1.5"/>
  <!-- Inner frame -->
  <rect x="6" y="6" width="114" height="84" rx="1" fill="#4A2E14" stroke="#7B5B3A" stroke-width="1"/>
  <!-- Canvas -->
  <rect x="10" y="10" width="106" height="76" fill="url(#pp-sky)"/>
  <!-- Ground -->
  <rect x="10" y="60" width="106" height="26" fill="#C4A575" opacity="0.7"/>
  <!-- Steps/ghats -->
  <rect x="10" y="60" width="106" height="4" fill="#D2B48C"/>
  <rect x="10" y="64" width="106" height="4" fill="#C4A575"/>
  <rect x="10" y="68" width="106" height="4" fill="#B8A060"/>
  <!-- River (Bagmati) -->
  <rect x="10" y="72" width="106" height="14" fill="#5B8FAF" opacity="0.6"/>
  <!-- Main pagoda temple -->
  <rect x="45" y="32" width="30" height="28" fill="#B8860B"/>
  <!-- Pagoda tier 1 -->
  <polygon points="40,32 60,18 80,32" fill="#8B4513"/>
  <!-- Pagoda tier 2 -->
  <polygon points="45,22 60,12 75,22" fill="#A0522D"/>
  <!-- Gold pinnacle/gajur -->
  <line x1="60" y1="12" x2="60" y2="6" stroke="#FFD700" stroke-width="2"/>
  <circle cx="60" cy="5" r="2" fill="#FFD700"/>
  <!-- Roof overhangs -->
  <line x1="38" y1="32" x2="82" y2="32" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="43" y1="22" x2="77" y2="22" stroke="#A0522D" stroke-width="1"/>
  <!-- Temple door -->
  <rect x="55" y="42" width="10" height="18" fill="#5D3A1A" rx="5" ry="0"/>
  <path d="M55,42 Q60,36 65,42" fill="#5D3A1A"/>
  <!-- Temple windows -->
  <rect x="47" y="38" width="5" height="6" fill="#FFECD2" stroke="#5D3A1A" stroke-width="0.5"/>
  <rect x="68" y="38" width="5" height="6" fill="#FFECD2" stroke="#5D3A1A" stroke-width="0.5"/>
  <!-- Dome structure (left) -->
  <path d="M15,60 L15,48 Q25,30 35,48 L35,60" fill="#D2B48C" stroke="#B8860B" stroke-width="0.5"/>
  <circle cx="25" cy="35" r="2" fill="#FFD700"/>
  <!-- Small shrine (right) -->
  <rect x="88" y="48" width="16" height="12" fill="#C4A575"/>
  <polygon points="86,48 96,38 106,48" fill="#8B4513"/>
  <line x1="96" y1="38" x2="96" y2="34" stroke="#FFD700" stroke-width="1"/>
  <!-- Smoke/incense -->
  <path d="M60,42 Q58,35 62,30 Q58,25 61,20" fill="none" stroke="#D3D3D3" stroke-width="0.8" opacity="0.4"/>
  <!-- Prayer flags tiny -->
  <line x1="25" y1="35" x2="60" y2="6" stroke="#999" stroke-width="0.3"/>
  <rect x="32" y="28" width="3" height="2" fill="#FF6347" opacity="0.5"/>
  <rect x="38" y="24" width="3" height="2" fill="#4169E1" opacity="0.5"/>
  <rect x="44" y="20" width="3" height="2" fill="#FFD700" opacity="0.5"/>
  <rect x="50" y="16" width="3" height="2" fill="#32CD32" opacity="0.5"/>
</svg>