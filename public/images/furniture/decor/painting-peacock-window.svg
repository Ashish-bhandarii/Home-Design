<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 120" width="95" height="120">
  <defs>
    <linearGradient id="pw-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4D2E"/>
      <stop offset="50%" stop-color="#2E5A3B"/>
      <stop offset="100%" stop-color="#1B4D2E"/>
    </linearGradient>
    <linearGradient id="pw-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D3A1A"/>
      <stop offset="100%" stop-color="#3E2610"/>
    </linearGradient>
    <radialGradient id="pw-center" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2C1A0E"/>
      <stop offset="100%" stop-color="#1A0E06"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <rect x="4" y="4" width="91" height="116" rx="2" fill="rgba(0,0,0,0.3)"/>
  <!-- Outer frame - dark green -->
  <rect x="0" y="0" width="91" height="116" rx="3" fill="url(#pw-frame)" stroke="#0E3018" stroke-width="1.5"/>
  <!-- Inner frame -->
  <rect x="6" y="6" width="79" height="104" rx="2" fill="#0E3018" stroke="#3A6B4A" stroke-width="1"/>
  <!-- Canvas - brick wall -->
  <rect x="10" y="10" width="71" height="96" fill="#8B4513" opacity="0.7"/>
  <rect x="10" y="10" width="71" height="96" fill="#A0522D"/>
  <!-- Brick lines -->
  <line x1="10" y1="18" x2="81" y2="18" stroke="#8B4513" stroke-width="0.4" opacity="0.4"/>
  <line x1="10" y1="26" x2="81" y2="26" stroke="#8B4513" stroke-width="0.4" opacity="0.4"/>
  <line x1="10" y1="90" x2="81" y2="90" stroke="#8B4513" stroke-width="0.4" opacity="0.4"/>
  <line x1="10" y1="98" x2="81" y2="98" stroke="#8B4513" stroke-width="0.4" opacity="0.4"/>
  <!-- Main circular window frame -->
  <circle cx="45.5" cy="55" r="32" fill="url(#pw-wood)" stroke="#2C1A0E" stroke-width="2"/>
  <circle cx="45.5" cy="55" r="29" fill="url(#pw-center)" stroke="#5D3A1A" stroke-width="1.5"/>
  <!-- Peacock body center -->
  <ellipse cx="45.5" cy="62" rx="6" ry="8" fill="#5D3A1A"/>
  <!-- Peacock head -->
  <circle cx="45.5" cy="50" r="4" fill="#5D3A1A"/>
  <!-- Beak -->
  <path d="M45.5,54 L44,56 L47,56 Z" fill="#8B6914"/>
  <!-- Crown feathers -->
  <line x1="43" y1="47" x2="41" y2="42" stroke="#5D3A1A" stroke-width="0.8"/>
  <circle cx="41" cy="41.5" r="1" fill="#5D3A1A"/>
  <line x1="45.5" y1="46" x2="45.5" y2="40" stroke="#5D3A1A" stroke-width="0.8"/>
  <circle cx="45.5" cy="39.5" r="1" fill="#5D3A1A"/>
  <line x1="48" y1="47" x2="50" y2="42" stroke="#5D3A1A" stroke-width="0.8"/>
  <circle cx="50" cy="41.5" r="1" fill="#5D3A1A"/>
  <!-- Tail feathers - radiating carved pattern -->
  <!-- Top feathers -->
  <path d="M45.5,55 Q45.5,30 45.5,28" fill="none" stroke="#3E2610" stroke-width="1.5"/>
  <path d="M45.5,55 Q35,32 30,30" fill="none" stroke="#3E2610" stroke-width="1.2"/>
  <path d="M45.5,55 Q55,32 60,30" fill="none" stroke="#3E2610" stroke-width="1.2"/>
  <path d="M45.5,55 Q25,38 20,38" fill="none" stroke="#3E2610" stroke-width="1"/>
  <path d="M45.5,55 Q65,38 70,38" fill="none" stroke="#3E2610" stroke-width="1"/>
  <!-- Side feathers -->
  <path d="M45.5,55 Q18,48 16,50" fill="none" stroke="#3E2610" stroke-width="1"/>
  <path d="M45.5,55 Q72,48 74,50" fill="none" stroke="#3E2610" stroke-width="1"/>
  <path d="M45.5,55 Q17,58 15,60" fill="none" stroke="#3E2610" stroke-width="1"/>
  <path d="M45.5,55 Q73,58 75,60" fill="none" stroke="#3E2610" stroke-width="1"/>
  <!-- Lower feathers -->
  <path d="M45.5,55 Q20,68 18,72" fill="none" stroke="#3E2610" stroke-width="1"/>
  <path d="M45.5,55 Q70,68 72,72" fill="none" stroke="#3E2610" stroke-width="1"/>
  <path d="M45.5,55 Q28,78 28,80" fill="none" stroke="#3E2610" stroke-width="1"/>
  <path d="M45.5,55 Q62,78 62,80" fill="none" stroke="#3E2610" stroke-width="1"/>
  <!-- Eye shapes on feather tips -->
  <ellipse cx="45.5" cy="29" rx="2.5" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="31" cy="31" rx="2.5" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="60" cy="31" rx="2.5" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="21" cy="39" rx="2.5" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="70" cy="39" rx="2.5" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="17" cy="51" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="74" cy="51" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="16" cy="61" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="75" cy="61" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="19" cy="73" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="72" cy="73" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="29" cy="81" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <ellipse cx="62" cy="81" rx="2" ry="2" fill="none" stroke="#5D3A1A" stroke-width="0.6"/>
  <!-- Concentric ring detail -->
  <circle cx="45.5" cy="55" r="12" fill="none" stroke="#4A2E14" stroke-width="0.5" opacity="0.5"/>
  <circle cx="45.5" cy="55" r="18" fill="none" stroke="#4A2E14" stroke-width="0.4" opacity="0.4"/>
  <circle cx="45.5" cy="55" r="24" fill="none" stroke="#4A2E14" stroke-width="0.3" opacity="0.3"/>
  <!-- Outer decorative ring -->
  <circle cx="45.5" cy="55" r="30.5" fill="none" stroke="#8B6914" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.5"/>
</svg>