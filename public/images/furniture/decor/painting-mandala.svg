<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="130" height="130">
  <rect x="4" y="4" width="124" height="124" rx="1" fill="#00000020"/>
  <rect x="1" y="1" width="128" height="128" rx="1" fill="#D4AF37" stroke="#B8860B" stroke-width="1.5"/>
  <rect x="5" y="5" width="120" height="120" fill="#1a1a2e"/>
  <!-- Mandala circles -->
  <circle cx="65" cy="65" r="50" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
  <circle cx="65" cy="65" r="40" fill="none" stroke="#22C55E" stroke-width="1.5" opacity="0.6"/>
  <circle cx="65" cy="65" r="30" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.7"/>
  <circle cx="65" cy="65" r="20" fill="#22C55E" opacity="0.2" stroke="#22C55E" stroke-width="1"/>
  <circle cx="65" cy="65" r="10" fill="#FFD700" opacity="0.3"/>
  <!-- Petals outer ring -->
  <g fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.6">
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(0 65 65)"/>
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(45 65 65)"/>
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(90 65 65)"/>
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(135 65 65)"/>
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(180 65 65)"/>
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(225 65 65)"/>
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(270 65 65)"/>
    <ellipse cx="65" cy="20" rx="8" ry="14" transform="rotate(315 65 65)"/>
  </g>
  <!-- Inner flower petals -->
  <g fill="#22C55E" opacity="0.3">
    <ellipse cx="65" cy="42" rx="5" ry="10" transform="rotate(0 65 65)"/>
    <ellipse cx="65" cy="42" rx="5" ry="10" transform="rotate(60 65 65)"/>
    <ellipse cx="65" cy="42" rx="5" ry="10" transform="rotate(120 65 65)"/>
    <ellipse cx="65" cy="42" rx="5" ry="10" transform="rotate(180 65 65)"/>
    <ellipse cx="65" cy="42" rx="5" ry="10" transform="rotate(240 65 65)"/>
    <ellipse cx="65" cy="42" rx="5" ry="10" transform="rotate(300 65 65)"/>
  </g>
  <!-- Center dot -->
  <circle cx="65" cy="65" r="4" fill="#FFD700" opacity="0.8"/>
</svg>