<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" width="150" height="100">
  <defs>
    <linearGradient id="sl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C5F8A"/>
      <stop offset="60%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#ADD8E6"/>
    </linearGradient>
    <linearGradient id="sl-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="50%" stop-color="#5D3A1A"/>
      <stop offset="100%" stop-color="#4A2E14"/>
    </linearGradient>
    <linearGradient id="sl-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#6B5B3A"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="4" y="4" width="146" height="96" rx="2" fill="rgba(0,0,0,0.3)"/>
  <!-- Outer frame -->
  <rect x="0" y="0" width="146" height="96" rx="2" fill="url(#sl-wood)" stroke="#3E2610" stroke-width="1.5"/>
  <!-- Inner frame -->
  <rect x="6" y="6" width="134" height="84" rx="1" fill="#4A2E14" stroke="#7B5B3A" stroke-width="1"/>
  <!-- Canvas -->
  <rect x="10" y="10" width="126" height="76" fill="url(#sl-sky)"/>
  <!-- Snow mountains background -->
  <polygon points="10,50 25,22 45,40 60,18 80,35 100,20 120,32 136,25 136,55 10,55" fill="#E8EEF4" opacity="0.6"/>
  <polygon points="55,25 60,18 65,25" fill="white" opacity="0.8"/>
  <polygon points="95,27 100,20 105,27" fill="white" opacity="0.8"/>
  <!-- Mid-ground terrain -->
  <polygon points="10,55 30,48 55,52 80,46 110,50 136,45 136,65 10,65" fill="#8B7D6B" opacity="0.5"/>
  <!-- Ground -->
  <rect x="10" y="60" width="126" height="26" fill="url(#sl-ground)" opacity="0.7"/>
  <!-- Stone house/lodge -->
  <rect x="85" y="45" width="24" height="20" fill="#808080"/>
  <polygon points="82,45 97,35 112,45" fill="#696969"/>
  <!-- Stone texture -->
  <line x1="85" y1="50" x2="109" y2="50" stroke="#6B6B6B" stroke-width="0.3"/>
  <line x1="85" y1="55" x2="109" y2="55" stroke="#6B6B6B" stroke-width="0.3"/>
  <!-- Door -->
  <rect x="93" y="52" width="6" height="13" fill="#5D3A1A"/>
  <!-- Window -->
  <rect x="101" y="48" width="5" height="4" fill="#ADD8E6" stroke="#5D3A1A" stroke-width="0.4"/>
  <!-- Prayer flags from house -->
  <line x1="97" y1="35" x2="130" y2="30" stroke="#555" stroke-width="0.5"/>
  <rect x="100" y="33" width="3" height="2" fill="#FF4500" opacity="0.6"/>
  <rect x="106" y="32" width="3" height="2" fill="#FFD700" opacity="0.6"/>
  <rect x="112" y="31" width="3" height="2" fill="#1E90FF" opacity="0.6"/>
  <rect x="118" y="31" width="3" height="2" fill="#228B22" opacity="0.6"/>
  <rect x="124" y="30" width="3" height="2" fill="white" opacity="0.6"/>
  <!-- Yak 1 -->
  <ellipse cx="40" cy="62" rx="10" ry="5.5" fill="#2C1A0E"/>
  <circle cx="31" cy="58" r="4" fill="#2C1A0E"/>
  <!-- Horns -->
  <path d="M29,55 Q26,50 28,48" fill="none" stroke="#8B8682" stroke-width="1"/>
  <path d="M33,55 Q36,50 34,48" fill="none" stroke="#8B8682" stroke-width="1"/>
  <!-- Yak legs -->
  <line x1="33" y1="67" x2="33" y2="73" stroke="#2C1A0E" stroke-width="2"/>
  <line x1="37" y1="67" x2="37" y2="73" stroke="#2C1A0E" stroke-width="2"/>
  <line x1="43" y1="67" x2="43" y2="73" stroke="#2C1A0E" stroke-width="2"/>
  <line x1="47" y1="67" x2="47" y2="73" stroke="#2C1A0E" stroke-width="2"/>
  <!-- Yak hair/shag -->
  <path d="M33,65 Q35,70 37,65 Q39,70 41,65 Q43,70 45,65 Q47,70 49,65" fill="none" stroke="#1A0E06" stroke-width="0.8"/>
  <!-- Yak 2 (smaller, distant) -->
  <ellipse cx="65" cy="58" rx="6" ry="3.5" fill="#2C1A0E" opacity="0.7"/>
  <circle cx="60" cy="55.5" r="2.5" fill="#2C1A0E" opacity="0.7"/>
  <line x1="61" y1="61" x2="61" y2="64" stroke="#2C1A0E" stroke-width="1.2" opacity="0.7"/>
  <line x1="63" y1="61" x2="63" y2="64" stroke="#2C1A0E" stroke-width="1.2" opacity="0.7"/>
  <line x1="67" y1="61" x2="67" y2="64" stroke="#2C1A0E" stroke-width="1.2" opacity="0.7"/>
  <line x1="69" y1="61" x2="69" y2="64" stroke="#2C1A0E" stroke-width="1.2" opacity="0.7"/>
  <!-- Sherpa figure -->
  <circle cx="75" cy="54" r="2.5" fill="#DEB887"/>
  <line x1="75" y1="56.5" x2="75" y2="65" stroke="#DC143C" stroke-width="2"/>
  <line x1="75" y1="65" x2="72" y2="72" stroke="#2C1A0E" stroke-width="1.2"/>
  <line x1="75" y1="65" x2="78" y2="72" stroke="#2C1A0E" stroke-width="1.2"/>
  <line x1="75" y1="58" x2="70" y2="62" stroke="#DC143C" stroke-width="1.2"/>
  <line x1="75" y1="58" x2="80" y2="61" stroke="#DC143C" stroke-width="1.2"/>
  <!-- Backpack/load -->
  <rect x="76" y="56" width="5" height="8" fill="#8B6914" rx="1"/>
  <!-- Path/trail -->
  <path d="M10,72 Q40,68 75,70 Q110,68 136,72" fill="none" stroke="#A09070" stroke-width="1" opacity="0.5"/>
  <!-- Stupa in distance -->
  <rect x="18" y="48" width="6" height="8" fill="#F5F5DC" opacity="0.6"/>
  <path d="M18,48 Q21,42 24,48" fill="#F5F5DC" opacity="0.6"/>
  <line x1="21" y1="42" x2="21" y2="38" stroke="#FFD700" stroke-width="0.8" opacity="0.6"/>
</svg>