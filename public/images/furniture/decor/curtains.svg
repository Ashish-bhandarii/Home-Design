  <circle cx="152" cy="4.5" r="4" fill="#A08968" stroke="#6B5B45" stroke-width="0.5"/>
  <!-- Left curtain panel -->
  <g>
    <path d="M 10 8 Q 15 8 18 10 Q 22 8 27 10 Q 32 8 35 10 Q 40 8 45 10 Q 48 8 52 10 L 55 8 L 55 195 Q 48 193 45 195 Q 40 193 35 195 Q 30 193 27 195 Q 22 193 18 195 Q 15 193 10 195 Z" fill="#D6D3D1" stroke="#A8A29E" stroke-width="0.5"/>
