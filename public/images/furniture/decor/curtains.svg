    <path d="M 27 10 L 27 195" stroke="#C4BFB9" stroke-width="3" opacity="0.3"/>
    <path d="M 35 10 L 35 195" stroke="#B8B3AD" stroke-width="2" opacity="0.5"/>
    <path d="M 45 10 L 45 195" stroke="#C4BFB9" stroke-width="3" opacity="0.3"/>
    <!-- Light effect -->
    <path d="M 22 10 L 22 195" stroke="#E8E5E2" stroke-width="1.5" opacity="0.4"/>
    <path d="M 40 10 L 40 195" stroke="#E8E5E2" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Right curtain panel -->
  <g>
    <path d="M 105 8 Q 110 8 113 10 Q 117 8 122 10 Q 127 8 130 10 Q 135 8 140 10 Q 143 8 147 10 L 150 8 L 150 195 Q 143 193 140 195 Q 135 193 130 195 Q 125 193 122 195 Q 117 193 113 195 Q 110 193 105 195 Z" fill="#D6D3D1" stroke="#A8A29E" stroke-width="0.5"/>
    <path d="M 113 10 L 113 195" stroke="#B8B3AD" stroke-width="2" opacity="0.5"/>
    <path d="M 122 10 L 122 195" stroke="#C4BFB9" stroke-width="3" opacity="0.3"/>
    <path d="M 130 10 L 130 195" stroke="#B8B3AD" stroke-width="2" opacity="0.5"/>
    <path d="M 140 10 L 140 195" stroke="#C4BFB9" stroke-width="3" opacity="0.3"/>
