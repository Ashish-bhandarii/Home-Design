<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="fabric1" x1="0%" y1="0%" x2="5%" y2="0%">
      <stop offset="0%" style="stop-color:#B8B3AD"/>
      <stop offset="50%" style="stop-color:#D6D3D1"/>
      <stop offset="100%" style="stop-color:#C4BFB9"/>
    </linearGradient>
  </defs>
  <!-- Curtain rod -->
