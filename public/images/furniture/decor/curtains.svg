  <!-- Center gap (window visible behind) -->
  <rect x="55" y="8" width="50" height="187" fill="#87CEEB" opacity="0.15"/>
  <!-- Tie-backs -->
  <ellipse cx="52" cy="120" rx="5" ry="8" fill="#A08968" stroke="#7A6548" stroke-width="0.5" opacity="0.8"/>
  <ellipse cx="108" cy="120" rx="5" ry="8" fill="#A08968" stroke="#7A6548" stroke-width="0.5" opacity="0.8"/>
